<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCaaS Automation Tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-bg: #16192a;
    --sidebar-hover: #1f2340;
    --sidebar-active: #2a2f52;
    --sidebar-text: #a0a8c8;
    --sidebar-text-bright: #e0e4f4;
    --sidebar-accent: #4a6cf7;
    --sidebar-border: #252846;
    --header-bg: #0f1120;
    --content-bg: #f4f5f9;
    --card-bg: #ffffff;
    --text: #1a1d2e;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --input-border: #d1d5db;
    --input-focus: #4a6cf7;
    --btn-primary: #4a6cf7;
    --btn-primary-hover: #3b5ce4;
    --btn-secondary: #6b7280;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --yellow: #b45309;
    --yellow-bg: #fffbeb;
    --cyan: #0e7490;
    --cyan-bg: #ecfeff;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --gray-bg: #f9fafb;
  }

  html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }

  /* Layout */
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    background: var(--header-bg);
    color: #fff;
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 1px solid #252846;
  }
  header .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
  header .logo span { color: var(--sidebar-accent); }
  header .badge {
    background: #252846;
    color: var(--sidebar-text);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .top-nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .top-nav a {
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    transition: background 0.1s, color 0.1s;
  }
  .top-nav a:hover,
  .top-nav a.active {
    background: #252846;
    color: #fff;
  }

  #body { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: 246px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    overflow-y: auto;
    overflow-x: hidden;
    border-right: 1px solid var(--sidebar-border);
    padding: 12px 0;
  }

  .tree-section-label {
    color: #4a5080;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 16px 4px;
  }

  .tree-node {
    --tree-level: 0;
    user-select: none;
  }

  .tree-node-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px calc(8px + (var(--tree-level) * 6px));
    cursor: pointer;
    color: var(--sidebar-text);
    font-weight: 500;
    transition: background 0.1s, color 0.1s;
    line-height: 1.2;
  }
  .tree-node-header:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
  .tree-node-header.active { background: var(--sidebar-active); color: #fff; }

  .tree-node-header .chevron {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    transition: transform 0.15s;
    opacity: 0.6;
  }
  .tree-node-header.open .chevron { transform: rotate(90deg); }

  .tree-node-header .icon { font-size: 14px; flex-shrink: 0; }

  .tree-node-children {
    display: none;
    margin-left: calc(8px + (var(--tree-level) * 6px));
    border-left: 1px solid rgba(160, 168, 200, 0.14);
  }
  .tree-node-children.open { display: block; }

  .tree-leaf {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px calc(22px + (var(--tree-level) * 6px));
    cursor: pointer;
    color: var(--sidebar-text);
    transition: background 0.1s, color 0.1s;
    font-weight: 400;
    line-height: 1.2;
  }
  .tree-leaf:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
  .tree-leaf.active { background: var(--sidebar-active); color: #fff; border-left: 2px solid var(--sidebar-accent); }
  .tree-leaf .icon { font-size: 13px; }

  /* Content */
  #content {
    flex: 1;
    overflow-y: auto;
    background: var(--content-bg);
    padding: 28px 32px;
  }

  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    text-align: center;
    gap: 8px;
  }
  .welcome .big-icon { font-size: 48px; opacity: 0.3; }
  .welcome h2 { font-size: 18px; color: var(--text); font-weight: 600; }
  .welcome p { font-size: 13px; }

  /* Tool panel */
  .tool-panel { max-width: 720px; }
  .tool-panel.wide { max-width: 1260px; }

  .tool-header { margin-bottom: 24px; }
  .tool-header .breadcrumb {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .tool-header .breadcrumb span { color: var(--sidebar-accent); }
  .tool-header h1 { font-size: 22px; font-weight: 700; color: var(--text); }
  .tool-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .form-grid { display: grid; gap: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--text); }
  .field .hint { font-size: 11px; color: var(--text-muted); }

  /* Path input with browse button */
  .path-row { display: flex; gap: 6px; }
  .path-row input { flex: 1; }
  .btn-browse {
    padding: 8px 12px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--gray-bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.1s, border-color 0.1s;
  }
  .btn-browse:hover { background: #e9ebf0; border-color: #adb5c2; }
  .btn-browse:active { background: #dde0e8; }
  .btn-browse:disabled { opacity: 0.5; cursor: not-allowed; }

  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--btn-primary); }
  .checkbox-row label { font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; }

  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }

  button {
    padding: 9px 20px;
    border-radius: 7px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary { background: var(--btn-primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--btn-primary-hover); }

  .btn-secondary {
    background: none;
    border: 1px solid var(--input-border);
    color: var(--text-muted);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--gray-bg); color: var(--text); }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .results-card { display: none; }
  .results-card.visible { display: block; }

  .summary-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .pill {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .pill.created  { background: var(--green-bg);  color: var(--green); }
  .pill.updated  { background: var(--yellow-bg); color: var(--yellow); }
  .pill.skipped  { background: var(--cyan-bg);   color: var(--cyan); }
  .pill.failed   { background: var(--red-bg);    color: var(--red); }
  .pill.total    { background: #f3f4f6;           color: #374151; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    background: var(--gray-bg);
    border-bottom: 1px solid var(--border);
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }

  .action-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .action-badge.created  { background: var(--green-bg);  color: var(--green); }
  .action-badge.updated  { background: var(--yellow-bg); color: var(--yellow); }
  .action-badge.skipped  { background: var(--cyan-bg);   color: var(--cyan); }
  .action-badge.failed   { background: var(--red-bg);    color: var(--red); }
  .action-badge.dry-run  { background: #f3f4f6;           color: #374151; }

  .error-text { color: var(--red); font-size: 12px; font-family: monospace; }

  .alert {
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .alert.error { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
  .alert.success { background: var(--green-bg); color: var(--green); border: 1px solid #bbf7d0; }
  .alert.warning { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #fde68a; }

  .preflight-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .preflight-data {
    max-height: 170px;
    overflow: auto;
    background: #0f172a;
    color: #e5e7eb;
    border-radius: 7px;
    padding: 10px 12px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
  .tool-name { font-weight: 700; color: var(--text); }

  /* IVR visual builder */
  .ivr-builder-grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .ivr-builder-stack { display: grid; gap: 16px; }
  .ivr-builder-main { display: grid; gap: 16px; }
  .module-palette { display: grid; gap: 8px; max-height: 540px; overflow: auto; padding-right: 4px; }
  .module-chip {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    background: #fff;
    display: grid;
    gap: 3px;
  }
  .module-chip.active { border-color: #93c5fd; background: #eff6ff; }
  .module-chip.locked { background: #f8fafc; color: var(--text-muted); }
  .module-chip-title { font-weight: 700; font-size: 13px; color: var(--text); }
  .module-chip.locked .module-chip-title { color: #64748b; }
  .module-chip-meta { font-size: 11px; color: var(--text-muted); line-height: 1.35; }
  .visual-canvas {
    position: relative;
    min-height: 430px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background:
      linear-gradient(#eef2f7 1px, transparent 1px),
      linear-gradient(90deg, #eef2f7 1px, transparent 1px),
      #fbfcff;
    background-size: 24px 24px;
  }
  .visual-canvas-inner { position: relative; min-width: 1160px; min-height: 430px; }
  .visual-edges { position: absolute; inset: 0; width: 1160px; height: 430px; pointer-events: none; }
  .visual-edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#ivr-arrow); }
  .visual-edge-label {
    position: absolute;
    padding: 2px 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: #334155;
    font-size: 11px;
    font-weight: 700;
    pointer-events: none;
  }
  .visual-node {
    position: absolute;
    width: 160px;
    min-height: 72px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    padding: 10px;
  }
  .visual-node-type { font-size: 10px; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
  .visual-node-label { margin-top: 4px; font-size: 14px; font-weight: 800; color: var(--text); }
  .visual-node-subtitle { margin-top: 3px; font-size: 11px; color: var(--text-muted); line-height: 1.35; overflow-wrap: anywhere; }
  .visual-node.incomingCall { border-color: #94a3b8; }
  .visual-node.play { border-color: #38bdf8; }
  .visual-node.menu { border-color: #f59e0b; }
  .visual-node.skillTransfer, .visual-node.campaignTransfer { border-color: #22c55e; }
  .visual-node.hangup { border-color: #ef4444; }
  .visual-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .menu-options-list { display: grid; gap: 10px; }
  .menu-option-row { display: grid; grid-template-columns: 54px 1fr 120px 1fr 36px; gap: 8px; align-items: end; }
  .menu-option-row button { padding: 8px 0; }

  .vcc-editor {
    border: 1px solid #9ca3af;
    background: #d8dde6;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
  }
  .vcc-menu-bar {
    height: 25px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 10px;
    background: #f3f4f6;
    border-bottom: 1px solid #aeb4bf;
    color: #111827;
    font-size: 12px;
  }
  .vcc-toolbar {
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    background: linear-gradient(#f9fafb, #d7dce5);
    border-bottom: 1px solid #aeb4bf;
    flex-wrap: wrap;
  }
  .vcc-tool-btn {
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid #9ca3af;
    border-radius: 3px;
    background: #f8fafc;
    color: #1f2937;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .vcc-tool-btn:hover:not(:disabled) { background: #e0e7ff; }
  .vcc-workspace {
    display: grid;
    grid-template-columns: 245px minmax(560px, 1fr) 300px;
    min-height: 620px;
  }
  .vcc-left, .vcc-right {
    background: #eef1f6;
    border-right: 1px solid #aeb4bf;
    overflow: hidden;
  }
  .vcc-right { border-right: none; border-left: 1px solid #aeb4bf; }
  .vcc-pane-title {
    background: #d1d5db;
    color: #111827;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 9px;
    border-bottom: 1px solid #aeb4bf;
  }
  .vcc-palette-search { padding: 8px; border-bottom: 1px solid #cbd5e1; }
  .vcc-module-list { max-height: 558px; overflow: auto; padding: 7px; display: grid; gap: 5px; }
  .vcc-module-group {
    margin-top: 8px;
    color: #475569;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .4px;
    text-transform: uppercase;
  }
  .vcc-module-item {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 7px;
    align-items: center;
    border: 1px solid #cbd5e1;
    background: #fff;
    padding: 6px;
    border-radius: 4px;
    cursor: pointer;
  }
  .vcc-module-item:hover { border-color: #64748b; background: #f8fafc; }
  .vcc-module-item.locked { background: #f1f5f9; color: #64748b; }
  .vcc-module-icon {
    width: 24px;
    height: 24px;
    border: 1px solid #94a3b8;
    border-radius: 3px;
    display: grid;
    place-items: center;
    background: #eef2ff;
    font-size: 13px;
  }
  .vcc-module-name { font-size: 12px; font-weight: 700; color: #111827; }
  .vcc-module-meta { font-size: 10px; color: #64748b; }
  .vcc-stage {
    background: #cdd3dd;
    display: grid;
    grid-template-rows: minmax(430px, 1fr) 150px;
  }
  .vcc-canvas-zone {
    position: relative;
    overflow: auto;
    background: #f8fafc;
    border-bottom: 1px solid #aeb4bf;
  }
  .vcc-zone-label {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 3;
    display: inline-block;
    background: #e5e7eb;
    border-right: 1px solid #aeb4bf;
    border-bottom: 1px solid #aeb4bf;
    padding: 5px 9px;
    color: #111827;
    font-size: 12px;
    font-weight: 700;
  }
  .vcc-canvas-inner { position: relative; min-width: 1180px; min-height: 510px; }
  .vcc-onhangup-inner { position: relative; min-width: 1180px; min-height: 145px; }
  .vcc-edges { position: absolute; inset: 0; width: 1180px; height: 510px; pointer-events: none; z-index: 1; }
  .vcc-edge { stroke: #111827; stroke-width: 1.6; fill: none; marker-end: url(#vcc-arrow); }
  .vcc-edge-label {
    position: absolute;
    z-index: 4;
    padding: 1px 5px;
    background: #fff;
    border: 1px solid #94a3b8;
    border-radius: 3px;
    font-size: 10px;
    color: #111827;
  }
  .vcc-node {
    position: absolute;
    z-index: 2;
    width: 116px;
    min-height: 70px;
    border: 1px solid #111827;
    background: #ffffff;
    border-radius: 2px;
    text-align: center;
    cursor: pointer;
    box-shadow: 1px 2px 3px rgba(15, 23, 42, .25);
  }
  .vcc-node.selected { outline: 3px solid #2563eb; outline-offset: 2px; }
  .vcc-node.connect-source { outline: 3px solid #f59e0b; outline-offset: 2px; }
  .vcc-node.unsupported { border-color: #b91c1c; background: #fff7ed; }
  .vcc-node-icon {
    width: 34px;
    height: 34px;
    margin: 7px auto 3px;
    border: 2px solid #475569;
    border-radius: 4px;
    display: grid;
    place-items: center;
    background: #e0f2fe;
    font-size: 16px;
  }
  .vcc-node-name { font-size: 11px; font-weight: 700; color: #111827; padding: 0 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vcc-node-port {
    position: absolute;
    width: 9px;
    height: 9px;
    border: 1px solid #111827;
    background: #fff;
  }
  .vcc-port-in { left: -5px; top: 32px; }
  .vcc-port-out { right: -5px; top: 32px; }
  .vcc-inspector { padding: 10px; display: grid; gap: 10px; max-height: 588px; overflow: auto; }
  .vcc-inspector-section { background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 10px; display: grid; gap: 9px; }
  .vcc-inspector-section h3 { font-size: 13px; margin: 0; color: #111827; }
  .vcc-statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 10px;
    background: #eef1f6;
    border-top: 1px solid #aeb4bf;
    color: #334155;
    font-size: 12px;
  }
  .vcc-bottom-tabs { display: flex; gap: 0; background: #d1d5db; border-top: 1px solid #aeb4bf; }
  .vcc-bottom-tab {
    border-radius: 0;
    border-right: 1px solid #aeb4bf;
    background: #e5e7eb;
    color: #334155;
    padding: 8px 14px;
  }
  .vcc-bottom-tab.active { background: #fff; color: #111827; }
  .vcc-bottom-panel { display: none; background: #fff; border: 1px solid #aeb4bf; border-top: none; padding: 12px; }
  .vcc-bottom-panel.active { display: block; }

  @media (max-width: 1080px) {
    .ivr-builder-grid { grid-template-columns: 1fr; }
    .menu-option-row { grid-template-columns: 1fr 1fr; }
    .vcc-workspace { grid-template-columns: 1fr; }
    .vcc-stage { min-height: 640px; }
  }

  /* Mode tabs */

function renderTree(nodes, container, depth = 0) {
  nodes.forEach(node => {
    const el = document.createElement("div");
    el.className = "tree-node";
    el.style.setProperty("--tree-level", depth);

    if (node.tool) {
      el.innerHTML = `
        <div class="tree-leaf" data-tool="${node.id}">
          <span class="icon">${node.icon}</span>
          ${node.label}
        </div>`;
      el.querySelector(".tree-leaf").addEventListener("click", () => selectTool(node.id));
    } else {
      el.innerHTML = `
        <div class="tree-node-header open" data-id="${node.id}">
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          <span class="icon">${node.icon}</span>
          ${node.label}
        </div>
        <div class="tree-node-children open" data-children="${node.id}"></div>`;

      el.querySelector(".tree-node-header").addEventListener("click", function() {
        this.classList.toggle("open");
        el.querySelector(".tree-node-children").classList.toggle("open");
      });

      if (node.children) {
        renderTree(node.children, el.querySelector(".tree-node-children"), depth + 1);
      }
    }

    container.appendChild(el);
  });
}

      <h1>${tool.name}</h1>

function setPlaybookAgentMode(mode) {
  playbookAgentMode = mode;
  document.getElementById("pa-tab-dry").classList.toggle("active", mode === "dry_run");
  document.getElementById("pa-tab-live").classList.toggle("active", mode === "live");
  document.getElementById("pa-live-card").style.display = mode === "live" ? "block" : "none";

async function runPlaybookAgentExecution() {
  const target = document.getElementById("pa-execution-results");
  if (!latestPlaybookAgentPlan) {
    target.innerHTML = `<div class="alert error">No generated plan is available.</div>`;
    return;
  }
  const payload = {
    approved: document.getElementById("pa-approved").checked,
    mode: playbookAgentMode,
    plan_id: latestPlaybookAgentPlan.plan_id,
    planned_calls: latestPlaybookAgentPlan.proposed_write_plan || [],
    domain: document.getElementById("pa-domain")?.value || "api.five9.com",
    username: document.getElementById("pa-username")?.value || "",
    password: document.getElementById("pa-password")?.value || "",
  };
  target.innerHTML = `<div class="alert warning">Executing approved plan...</div>`;
  try {
    const res = await fetch("/api/agent/playbook/execute", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const execData = await readApiResponse(res);
    if (!res.ok) {
      target.innerHTML = `<div class="alert error">Error: ${escHtml(execData.detail || res.statusText)}</div>`;
      return;
    }
    renderCoreWriteResults(target, execData);
  } catch (e) {
    target.innerHTML = `<div class="alert error">Network error: ${escHtml(e.message)}</div>`;
  }
}

function collectPromptBulkUploadForm() {
  const shared = {
    domain: document.getElementById("f-domain").value,

    password: document.getElementById("f-password").value,
    dry_run: document.getElementById("f-dryrun").checked,

    return {
      _endpoint: "/api/run/five9/prompt-studio/run",
      approved: document.getElementById("f-studio-approved").checked,
      prompts: studioPrompts,
      selected_voice: selectedStudioVoice(),
      voice_overrides: studioVoiceOverrides(),
      overwrite: document.getElementById("f-studio-overwrite").checked,
      studio_api_key: document.getElementById("f-studio-api-key").value,
      studio_base_url: document.getElementById("f-studio-base-url").value.trim() || "https://api.us7.studioportal.io",
      studio_scope: document.getElementById("f-studio-scope").value,
      studio_scope_id: document.getElementById("f-studio-scope-id").value.trim(),
      five9_domain: shared.domain,
      five9_username: shared.username,

    _endpoint: "/api/run/five9/prompt-bulk-upload",
    manifest_path: document.getElementById("f-manifest").value.trim(),
    wav_dir: document.getElementById("f-wavdir").value.trim() || ".",

function studioCredentialPayload() {
  return {
    studio_api_key: document.getElementById("f-studio-api-key").value,
    studio_base_url: document.getElementById("f-studio-base-url").value.trim() || "https://api.us7.studioportal.io",
    studio_scope: document.getElementById("f-studio-scope").value,
    studio_scope_id: document.getElementById("f-studio-scope-id").value.trim(),
  };
}

function applyStudioRegionPreset() {
  const region = document.getElementById("f-studio-region").value;
  if (region !== "custom") {
    document.getElementById("f-studio-base-url").value = region;
  }
}

function syncStudioRegionPreset() {
  const baseUrl = document.getElementById("f-studio-base-url").value.trim();
  const region = document.getElementById("f-studio-region");
  const matching = [...region.options].find(option => option.value === baseUrl);
  region.value = matching ? matching.value : "custom";
}

function selectedStudioVoice() {
  const voiceId = document.getElementById("f-studio-global-voice").value;
  return studioVoices.find(v => String(v.tts_voice_id) === String(voiceId)) || {};
}

function studioVoiceOverrides() {
  const overrides = {};
  studioPrompts.forEach((prompt, index) => {
    const select = document.getElementById(`studio-voice-${index}`);
    if (!select || !select.value || select.value === document.getElementById("f-studio-global-voice").value) return;
    const voice = studioVoices.find(v => String(v.tts_voice_id) === String(select.value));
    if (voice) overrides[prompt.prompt_name] = voice;
  });
  return overrides;
}

async function loadStudioPromptCredentials() {
  const btn = document.getElementById("load-studio-creds-btn");
  btn.textContent = "Loading...";
  btn.disabled = true;
  try {
    const res = await fetch("/api/credentials/studio-prompt");
    const data = await readApiResponse(res);
    if (!res.ok) throw new Error(data.detail || res.statusText);
    if (data.studio_base_url) document.getElementById("f-studio-base-url").value = data.studio_base_url;
    if (data.studio_scope) document.getElementById("f-studio-scope").value = data.studio_scope;
    if (data.studio_scope_id) document.getElementById("f-studio-scope-id").value = data.studio_scope_id;
    if (data.studio_api_key) document.getElementById("f-studio-api-key").value = data.studio_api_key;
    syncStudioRegionPreset();
    btn.textContent = "Loaded";
    setTimeout(() => { btn.textContent = "Load Studio from .env"; btn.disabled = false; }, 1500);
  } catch (e) {
    btn.textContent = "Failed";
    btn.disabled = false;
  }
}

async function previewStudioPrompts() {
  const resultsArea = document.getElementById("results-area");
  const fileInput = document.getElementById("f-studio-playbook");
  if (!fileInput.files[0]) {
    resultsArea.innerHTML = `<div class="alert error">Choose a playbook file first.</div>`;
    return;
  }
  const payload = new FormData();
  payload.append("file", fileInput.files[0]);
  try {
    const res = await fetch("/api/run/five9/prompt-studio/preview", { method: "POST", body: payload });
    const data = await readApiResponse(res);
    if (!res.ok) throw new Error(data.detail || res.statusText);
    studioPrompts = data.prompts || [];
    renderStudioPromptPreview();
    resultsArea.innerHTML = "";
  } catch (e) {
    resultsArea.innerHTML = `<div class="alert error">Preview failed: ${escHtml(e.message)}</div>`;
  }
}

async function fetchStudioVoices() {
  const resultsArea = document.getElementById("results-area");
  try {
    const res = await fetch("/api/run/five9/prompt-studio/voices", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(studioCredentialPayload()),
    });
    const data = await readApiResponse(res);
    if (!res.ok) throw new Error(data.detail || res.statusText);
    studioVoices = data.voices || [];
    renderStudioVoiceOptions();
    renderStudioPromptPreview();
    resultsArea.innerHTML = `<div class="alert success">${studioVoices.length} Studio TTS voice(s) loaded.</div>`;
  } catch (e) {
    resultsArea.innerHTML = `<div class="alert error">Voice lookup failed: ${escHtml(e.message)}</div>`;
  }
}

async function probeStudioAudio() {
  const resultsArea = document.getElementById("results-area");
  const prompt = studioPrompts[0];
  const voice = selectedStudioVoice();
  if (!prompt) {
    resultsArea.innerHTML = `<div class="alert error">Preview playbook prompts before probing audio.</div>`;
    return;
  }
  try {
    const res = await fetch("/api/run/five9/prompt-studio/audio-probe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ...studioCredentialPayload(),
        prompt_text: prompt.text,
        selected_voice: voice,
      }),
    });
    const data = await readApiResponse(res);
    if (!res.ok) throw new Error(data.detail || res.statusText);
    resultsArea.innerHTML = `<div class="alert success">Audio probe saved ${escHtml(data.bytes)} bytes to ${escHtml(data.wav_path)} via ${escHtml(data.source)}.</div>`;
  } catch (e) {
    resultsArea.innerHTML = `<div class="alert error">Audio probe failed: ${escHtml(e.message)}</div>`;
  }
}

function addIvrMenuOption() {
  let plan;
  try {
    plan = buildIvrPlanFromControls();
  } catch (e) {
    plan = JSON.parse(JSON.stringify(SAMPLE_IVR_BUILD_PLAN));
  }
  const used = new Set((plan.menu.options || []).map(option => String(option.digit)));
  const digit = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"].find(value => !used.has(value)) || "";
  plan.menu.options.push({ digit, label: "New Route", transfer_type: "skill", target: "New Skill" });
  writeIvrBuildPlan(plan);
  syncIvrControlsFromPlan(plan);
  refreshIvrBuilderVisualFromPlan();
}

function renderIvrVisualPlan(visual) {
  const status = document.getElementById("ib-visual-status");
  const canvas = document.getElementById("ib-visual-canvas");
  const compileBtn = document.getElementById("ib-compile-btn");
  compileBtn.disabled = !visual.valid;
  status.innerHTML = `
    <span class="pill ${visual.valid ? "created" : "failed"}">${visual.valid ? "valid" : "invalid"}</span>
    <span class="pill total">${visual.nodes.length} nodes</span>
    <span class="pill total">${visual.edges.length} edges</span>
    ${visual.errors?.length ? `<span class="pill failed">${escHtml(visual.errors.join("; "))}</span>` : ""}
  `;
  if (!visual.valid) {
    canvas.innerHTML = `<div class="alert error" style="margin:16px">${escHtml(visual.errors.join("; ") || "Build plan is invalid.")}</div>`;
    return;
  }

  const nodeMap = new Map(visual.nodes.map(node => [node.id, node]));
  const edgeLabels = visual.edges.filter(edge => edge.label).map(edge => {
    const from = nodeMap.get(edge.from);
    const to = nodeMap.get(edge.to);
    if (!from || !to) return "";
    const x = (Number(from.x) + Number(to.x)) / 2 + 58;
    const y = (Number(from.y) + Number(to.y)) / 2 + 28;
    return `<div class="visual-edge-label" style="left:${x}px; top:${y}px">${escHtml(edge.label)}</div>`;
  }).join("");
  const paths = visual.edges.map(edge => {
    const from = nodeMap.get(edge.from);
    const to = nodeMap.get(edge.to);
    if (!from || !to) return "";
    const x1 = Number(from.x) + 160;
    const y1 = Number(from.y) + 36;
    const x2 = Number(to.x);
    const y2 = Number(to.y) + 36;
    const mid = Math.max(x1 + 40, (x1 + x2) / 2);
    return `<path class="visual-edge" d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}"></path>`;
  }).join("");
  const nodes = visual.nodes.map(node => `
    <div class="visual-node ${escHtml(node.module_type)}" style="left:${Number(node.x)}px; top:${Number(node.y)}px">
      <div class="visual-node-type">${escHtml(node.module_type)}</div>
      <div class="visual-node-label">${escHtml(node.label)}</div>
      <div class="visual-node-subtitle">${escHtml(node.subtitle || "")}</div>
    </div>
  `).join("");
  canvas.innerHTML = `
    <div class="visual-canvas-inner">
      <svg class="visual-edges" viewBox="0 0 1160 430" preserveAspectRatio="none">
        <defs>
          <marker id="ivr-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#64748b"></path>
          </marker>
        </defs>
        ${paths}
      </svg>
      ${edgeLabels}
      ${nodes}
    </div>
  `;
}

function renderIvrVisualError(message) {
  const status = document.getElementById("ib-visual-status");
  const canvas = document.getElementById("ib-visual-canvas");
  if (document.getElementById("ib-compile-btn")) document.getElementById("ib-compile-btn").disabled = true;
  status.innerHTML = `<span class="pill failed">invalid</span>`;
  canvas.innerHTML = `<div class="alert error" style="margin:16px">${escHtml(message)}</div>`;
}

function debounce(fn, wait) {
  let timer = null;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), wait);
  };
}

async function runIvrBuilderDeploy() {
  let plan;
  try {
    plan = readIvrBuildPlan();
  } catch (e) {
    showIvrBuilderError(`Invalid build plan JSON: ${e.message}`);
    return;
  }
  const xml = document.getElementById("ib-xml-output").value.trim();
  if (!xml) {
    showIvrBuilderError("Compile XML before deploy.");
    return;
  }
  const payload = {
    mode: ivrBuilderMode,
    approved: document.getElementById("ib-approved").checked,
    domain: document.getElementById("ib-domain").value,
    username: document.getElementById("ib-username").value.trim(),
    password: document.getElementById("ib-password").value,
    script_name: plan.script_name,
    description: plan.description || "",
    xml_definition: xml
  };
  const data = await postIvrBuilderJson("/api/run/five9/ivr-builder/deploy", payload, "IVR Builder Deploy");
  if (data.results) {
    renderIvrScriptResults(document.getElementById("results-area"), data);
  }
}

async function postIvrBuilderJson(endpoint, payload, title) {
  const resultsArea = document.getElementById("results-area");
  resultsArea.innerHTML = `<div class="alert warning">Running ${escHtml(title)}...</div>`;
  const res = await fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!res.ok) {
    throw new Error(data.detail || res.statusText);
  }
  showIvrBuilderData(title, data);
  return data;
}

function showIvrBuilderData(title, data) {
  const resultsArea = document.getElementById("results-area");
  const validBadge = data.valid === undefined
    ? ""
    : data.valid
      ? `<span class="pill created">valid</span>`
      : `<span class="pill failed">invalid</span>`;
  resultsArea.innerHTML = `
    <div class="card results-card visible" style="margin-top:16px">
      <div class="card-title">${escHtml(title)}</div>
      <div class="summary-pills">
        ${validBadge}
        ${data.build_plan_schema ? `<span class="pill total">${escHtml(data.build_plan_schema)}</span>` : ""}
      </div>
      ${data.flow_summary ? `<pre class="preflight-data">${escHtml(data.flow_summary)}</pre>` : ""}
      <pre class="preflight-data">${escHtml(JSON.stringify(data, null, 2))}</pre>
    </div>`;
  resultsArea.scrollIntoView({ behavior: "smooth", block: "start" });
}

function showIvrBuilderError(message) {
  const resultsArea = document.getElementById("results-area");
  resultsArea.innerHTML = `<div class="alert error">Error: ${escHtml(message)}</div>`;
}

async function copyIvrBuilderXml() {
  const xml = document.getElementById("ib-xml-output").value;
  if (!xml.trim()) {
    showIvrBuilderError("No generated XML to copy.");
    return;
  }
  try {
    await navigator.clipboard.writeText(xml);
    showIvrBuilderData("Copy XML", { result: "copied", bytes: xml.length });
  } catch (e) {
    showIvrBuilderError(`Copy failed: ${e.message}`);
  }
}

function downloadIvrBuilderXml() {
  const xml = document.getElementById("ib-xml-output").value;
  if (!xml.trim()) {
    showIvrBuilderError("No generated XML to export.");
    return;
  }
  let scriptName = "five9-ivr-script";
  try {
    scriptName = readIvrBuildPlan().script_name || scriptName;
  } catch (e) {
    // Keep fallback name.
  }
  const blob = new Blob([xml], { type: "application/xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${scriptName.replace(/[^a-z0-9_-]+/gi, "_")}.five9ivr`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function vccRenderPalette() {
  const list = document.getElementById("ib-catalog");
  if (!list) return;
  const filter = (document.getElementById("ib-palette-search")?.value || "").trim().toLowerCase();
  let currentGroup = "";
  const rows = [];
  for (const module of vccIvrState.palette) {
    const haystack = `${module.label} ${module.module_type} ${module.group}`.toLowerCase();
    if (filter && !haystack.includes(filter)) continue;
    if (module.group !== currentGroup) {
      currentGroup = module.group;
      rows.push(`<div class="vcc-module-group">${escHtml(currentGroup)}</div>`);
    }
    rows.push(`
      <div class="vcc-module-item ${module.locked ? "locked" : ""}" draggable="true" ondragstart="vccStartPaletteDrag(event, '${escHtml(module.module_type)}')" onclick="vccAddModule('${escHtml(module.module_type)}')" title="${escHtml(module.locked_reason || module.output_behavior || "")}">
        <div class="vcc-module-icon">${vccModuleIcon(module.module_type)}</div>
        <div>
          <div class="vcc-module-name">${escHtml(module.label)}</div>
          <div class="vcc-module-meta">${escHtml(module.module_type)} · ${escHtml(module.status_label || module.generation_status)}</div>
        </div>
      </div>
    `);
  }
  list.innerHTML = rows.join("") || `<div class="alert warning">No matching modules.</div>`;
}

function vccStartPaletteDrag(event, moduleType) {
  event.dataTransfer.setData("text/plain", moduleType);
  event.dataTransfer.effectAllowed = "copy";
}

function vccAllowDrop(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = "copy";
}

function vccDropModule(event) {
  event.preventDefault();
  const moduleType = event.dataTransfer.getData("text/plain");
  if (!moduleType) return;
  const canvas = document.getElementById("ib-visual-canvas");
  const rect = canvas.getBoundingClientRect();
  vccAddModule(moduleType, {
    x: Math.max(0, Math.round(event.clientX - rect.left + canvas.scrollLeft - 58)),
    y: Math.max(0, Math.round(event.clientY - rect.top + canvas.scrollTop - 35))
  });
}

function vccAddModule(moduleType, position = null) {
  const module = vccIvrState.palette.find(item => item.module_type === moduleType) || { module_type: moduleType, label: moduleType, locked: true };
  if (!vccIvrState.hasWorkspace) {
    vccStartBlankScript();
  }
  if (module.locked) {
    const id = `ref_${moduleType}_${Date.now()}`;
    vccIvrState.referenceNodes.push({
      id,
      module_type: moduleType,
      label: module.label || moduleType,
      subtitle: "Reference only - Not compiler-supported yet",
      x: position?.x ?? 80 + (vccIvrState.referenceNodes.length % 5) * 145,
      y: position?.y ?? 360,
      unsupported: true,
      zone: "main"
    });
    vccIvrState.selectedNodeId = id;
    vccRenderVisual();
    return;
  }

  if (moduleType === "skillTransfer" || moduleType === "campaignTransfer") {
    const plan = readIvrBuildPlan();
    const used = new Set((plan.menu?.options || []).map(option => String(option.digit)));
    const digit = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"].find(value => !used.has(value)) || "";
    plan.menu.options.push({
      digit,
      label: moduleType === "skillTransfer" ? "New Skill Route" : "New Campaign Route",
      transfer_type: moduleType === "skillTransfer" ? "skill" : "campaign",
      target: moduleType === "skillTransfer" ? "New Skill" : "New Campaign"
    });
    if (position) {
      plan.layout = plan.layout && typeof plan.layout === "object" ? plan.layout : {};
      plan.layout[`transfer_${digit}`] = { x: position.x, y: position.y };
    }
    writeIvrBuildPlan(plan);
    vccIvrState.selectedNodeId = `transfer_${digit}`;
    vccRefreshFromBuildPlan();
    return;
  }

  const existing = {
    incomingCall: "incoming",
    play: "greeting",
    menu: "menu",
    hangup: "hangup"
  }[moduleType];
  if (existing) {
    vccIvrState.selectedNodeId = existing;
    vccRenderVisual();
    return;
  }

  const id = `node_${moduleType}_${Date.now()}`;
  vccIvrState.customNodes.push({
    id,
    module_type: moduleType,
    label: module.label || moduleType,
    subtitle: module.status_label || "Compiler candidate",
    x: position?.x ?? 120 + (vccIvrState.customNodes.length % 5) * 170,
    y: position?.y ?? 310,
    config: vccDefaultNodeConfig(moduleType),
    unsupported: false,
    zone: "main",
    certification: module.certification || {}
  });
  vccIvrState.selectedNodeId = id;
  vccRenderVisual();
}

async function vccRefreshFromBuildPlan() {
  if (!vccIvrState.hasWorkspace) {
    vccRenderStartScreen();
    return;
  }
  try {
    const visual = await visualizeIvrPlan(readIvrBuildPlan());
    if (!visual.valid && visual.errors?.includes("menu.options must include at least one option")) {
      const plan = readIvrBuildPlan();
      const layout = plan.layout || {};
      visual.valid = true;
      visual.errors = [];
      visual.warnings = ["Blank script scaffold: add or connect modules before deploy."];
      visual.nodes = [
        { id: "incoming", module_type: "incomingCall", label: "Incoming Call", subtitle: plan.script_name || "", x: layout.incoming?.x ?? 40, y: layout.incoming?.y ?? 170, locked: false },
        { id: "greeting", module_type: "play", label: "Play Greeting", subtitle: plan.greeting?.prompt_name || "", x: layout.greeting?.x ?? 260, y: layout.greeting?.y ?? 170, locked: false },
        { id: "menu", module_type: "menu", label: plan.menu?.name || "Main Menu", subtitle: "0 options", x: layout.menu?.x ?? 500, y: layout.menu?.y ?? 170, locked: false },
        { id: "hangup", module_type: "hangup", label: "Hangup", subtitle: "No Match / No Input", x: layout.hangup?.x ?? 1010, y: layout.hangup?.y ?? 170, locked: false }
      ];
      visual.edges = [
        { id: "edge_incoming_greeting", from: "incoming", to: "greeting", label: "" },
        { id: "edge_greeting_menu", from: "greeting", to: "menu", label: "" },
        { id: "edge_menu_hangup_no_match", from: "menu", to: "hangup", label: "No Match" },
        { id: "edge_menu_hangup_no_input", from: "menu", to: "hangup", label: "No Input" }
      ];
    }
    vccIvrState.visual = visual;
    vccRenderVisual();
  } catch (e) {
    renderIvrVisualError(e.message);
  }
}

function vccRenderVisual() {
  const visual = vccIvrState.visual;
  if (!visual) return;
  const main = document.getElementById("ib-visual-canvas");
  const hangup = document.getElementById("ib-onhangup-canvas");
  const status = document.getElementById("ib-visual-status");
  const allNodes = [...(visual.nodes || []), ...vccIvrState.customNodes, ...vccIvrState.referenceNodes];
  const allEdges = [...(visual.edges || []), ...vccIvrState.canvasEdges];
  const unsupported = vccIvrState.referenceNodes.filter(node => node.zone !== "reference");
  const compileAllowed = visual.valid && unsupported.length === 0 && !vccIvrState.importedMode;
  document.getElementById("ib-compile-btn").disabled = !compileAllowed;
  document.getElementById("ib-vcc-status-text").textContent = compileAllowed
    ? "Supported flow ready to compile"
    : vccIvrState.importedMode
      ? "Imported script is view-only. Rebuild it as a supported compiler plan before deploy."
      : unsupported.length
      ? "Compile blocked: unsupported module exists in Main Flow"
      : (visual.errors || []).join("; ");
  status.innerHTML = `
    <span class="pill ${compileAllowed ? "created" : "failed"}">${compileAllowed ? "compile-ready" : "blocked"}</span>
    ${vccIvrState.connectMode ? `<span class="pill skipped">connect mode</span>` : ""}
    <span class="pill total">${allNodes.length} modules</span>
    <span class="pill total">${allEdges.length} links</span>
  `;

  const nodeMap = new Map(allNodes.map(node => [node.id, node]));
  const paths = allEdges.map(edge => {
    const from = nodeMap.get(edge.from || edge.source);
    const to = nodeMap.get(edge.to || edge.target);
    if (!from || !to) return "";
    const x1 = Number(from.x) + 116;
    const y1 = Number(from.y) + 35;
    const x2 = Number(to.x);
    const y2 = Number(to.y) + 35;
    const mid = Math.max(x1 + 35, (x1 + x2) / 2);
    return `<path class="vcc-edge" d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}"></path>`;
  }).join("");
  const labels = allEdges.filter(edge => edge.label).map(edge => {
    const from = nodeMap.get(edge.from || edge.source);
    const to = nodeMap.get(edge.to || edge.target);
    if (!from || !to) return "";
    const x = (Number(from.x) + Number(to.x)) / 2 + 44;
    const y = (Number(from.y) + Number(to.y)) / 2 + 24;
    return `<div class="vcc-edge-label" style="left:${x}px;top:${y}px">${escHtml(edge.label)}</div>`;
  }).join("");
  const nodes = allNodes.map(node => `
    <div class="vcc-node ${node.unsupported ? "unsupported" : ""} ${vccIvrState.connectSourceId === node.id ? "connect-source" : ""} ${vccIvrState.selectedNodeId === node.id ? "selected" : ""}" data-node-id="${escHtml(node.id)}" style="left:${Number(node.x)}px;top:${Number(node.y)}px" onpointerdown="vccStartNodeDrag(event, '${escHtml(node.id)}')" onclick="vccHandleNodeClick('${escHtml(node.id)}')">
      <div class="vcc-node-port vcc-port-in"></div>
      <div class="vcc-node-port vcc-port-out"></div>
      <div class="vcc-node-icon">${vccModuleIcon(node.module_type)}</div>
      <div class="vcc-node-name">${escHtml(node.label)}</div>
    </div>
  `).join("");
  main.innerHTML = `
    <svg class="vcc-edges" viewBox="0 0 1180 510" preserveAspectRatio="none">
      <defs><marker id="vcc-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"></path></marker></defs>
      ${paths}
    </svg>
    ${labels}
    ${nodes}
  `;
  hangup.innerHTML = `
    <svg class="vcc-edges" viewBox="0 0 1180 145" preserveAspectRatio="none">
      <defs><marker id="vcc-arrow-h" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"></path></marker></defs>
      <path class="vcc-edge" marker-end="url(#vcc-arrow-h)" d="M 166 70 C 230 70, 230 70, 294 70"></path>
    </svg>
    <div class="vcc-node" style="left:50px;top:35px"><div class="vcc-node-port vcc-port-out"></div><div class="vcc-node-icon">✖</div><div class="vcc-node-name">StartOnHangup</div></div>
    <div class="vcc-node" style="left:295px;top:35px"><div class="vcc-node-port vcc-port-in"></div><div class="vcc-node-icon">☎</div><div class="vcc-node-name">Hangup</div></div>
  `;
  vccRenderInspector();
}

function vccHandleNodeClick(nodeId) {
  if (vccIvrState.connectMode) {
    vccHandleConnectClick(nodeId);
    return;
  }
  vccSelectNode(nodeId);
}

function vccSelectNode(nodeId) {
  vccIvrState.selectedNodeId = nodeId;
  vccRenderVisual();
}

function vccHandleConnectClick(nodeId) {
  if (vccIvrState.importedMode) {
    showIvrBuilderError("Imported scripts are view-only. Start a blank compiler-backed script to edit connections.");
    return;
  }
  if (!vccIvrState.connectSourceId) {
    vccIvrState.connectSourceId = nodeId;
    vccIvrState.selectedNodeId = nodeId;
    document.getElementById("ib-vcc-status-text").textContent = `Connect mode: source ${nodeId} selected. Choose target.`;
    vccRenderVisual();
    return;
  }
  const source = vccIvrState.connectSourceId;
  vccIvrState.connectSourceId = null;
  vccConnectNodes(source, nodeId);
}

function vccConnectNodes(sourceId, targetId) {
  if (sourceId === targetId) {
    showIvrBuilderError("Cannot connect a module to itself.");
    vccRenderVisual();
    return;
  }
  const existingEdges = [...(((vccIvrState.visual || {}).edges) || []), ...vccIvrState.canvasEdges];
  if (existingEdges.some(edge => (edge.from || edge.source) === sourceId && (edge.to || edge.target) === targetId)) {
    document.getElementById("ib-vcc-status-text").textContent = "Those modules are already connected.";
    vccRenderVisual();
    return;
  }
  const sourceNode = vccFindCanvasNode(sourceId);
  const defaultLabel = sourceNode && ["menu", "ifElse", "case", "answerMachine"].includes(sourceNode.module_type) ? "Next" : "success";
  const label = window.prompt("Connection label / branch output", defaultLabel) || defaultLabel;
  vccIvrState.canvasEdges.push({
    id: `edge_${sourceId}_${targetId}_${Date.now()}`,
    from: sourceId,
    to: targetId,
    source: sourceId,
    target: targetId,
    label
  });
  document.getElementById("ib-vcc-status-text").textContent = `Connected ${sourceId} to ${targetId}.`;
  vccRenderVisual();
  return;
  if (sourceId === "incoming" && targetId === "greeting") {
    document.getElementById("ib-vcc-status-text").textContent = "Incoming Call is connected to Greeting by the compiler.";
    vccRenderVisual();
    return;
  }
  if (sourceId === "greeting" && targetId === "menu") {
    document.getElementById("ib-vcc-status-text").textContent = "Greeting is connected to Menu by the compiler.";
    vccRenderVisual();
    return;
  }
  if (sourceId.startsWith("transfer_") && targetId === "hangup") {
    document.getElementById("ib-vcc-status-text").textContent = "Transfer completion is connected to Hangup by the compiler.";
    vccRenderVisual();
    return;
  }
  if (sourceId === "menu" && targetId.startsWith("transfer_")) {
    const plan = readIvrBuildPlan();
    const digit = targetId.replace("transfer_", "");
    const option = (plan.menu?.options || []).find(item => String(item.digit) === digit);
    if (!option) {
      showIvrBuilderError("Menu can only connect to a route created from a Skill Transfer block.");
      vccRenderVisual();
      return;
    }
    document.getElementById("ib-vcc-status-text").textContent = `Menu option ${digit} is connected to ${option.label}.`;
    vccRenderVisual();
    return;
  }
  showIvrBuilderError("That connection is not supported by the V1 compiler. V1 supports Incoming -> Greeting -> Menu -> Skill Transfer -> Hangup.");
  vccRenderVisual();
}

function vccStartNodeDrag(event, nodeId) {
  if (event.button !== 0) return;
  const node = vccFindCanvasNode(nodeId);
  if (!node) return;
  event.preventDefault();
  event.stopPropagation();
  vccIvrState.drag = {
    nodeId,
    startClientX: event.clientX,
    startClientY: event.clientY,
    startX: Number(node.x) || 0,
    startY: Number(node.y) || 0,
    x: Number(node.x) || 0,
    y: Number(node.y) || 0,
    moved: false
  };
  document.addEventListener("pointermove", vccMoveNodeDrag);
  document.addEventListener("pointerup", vccEndNodeDrag, { once: true });
}

function vccMoveNodeDrag(event) {
  const drag = vccIvrState.drag;
  if (!drag) return;
  drag.x = Math.max(0, Math.round(drag.startX + event.clientX - drag.startClientX));
  drag.y = Math.max(0, Math.round(drag.startY + event.clientY - drag.startClientY));
  drag.moved = true;
  const el = document.querySelector(`[data-node-id="${CSS.escape(drag.nodeId)}"]`);
  if (el) {
    el.style.left = `${drag.x}px`;
    el.style.top = `${drag.y}px`;
  }
}

function vccEndNodeDrag() {
  document.removeEventListener("pointermove", vccMoveNodeDrag);
  const drag = vccIvrState.drag;
  vccIvrState.drag = null;
  if (!drag || !drag.moved) return;
  vccApplyNodePosition(drag.nodeId, drag.x, drag.y);
}

function vccFindCanvasNode(nodeId) {
  return [
    ...((vccIvrState.visual || {}).nodes || []),
    ...vccIvrState.customNodes,
    ...vccIvrState.referenceNodes
  ].find(node => node.id === nodeId);
}

function vccApplyNodePosition(nodeId, x, y) {
  const custom = vccIvrState.customNodes.find(node => node.id === nodeId);
  if (custom) {
    custom.x = x;
    custom.y = y;
    vccIvrState.selectedNodeId = nodeId;
    vccRenderVisual();
    return;
  }
  const reference = vccIvrState.referenceNodes.find(node => node.id === nodeId);
  if (reference) {
    reference.x = x;
    reference.y = y;
    vccIvrState.selectedNodeId = nodeId;
    vccRenderVisual();
    return;
  }
  const plan = readIvrBuildPlan();
  plan.layout = plan.layout && typeof plan.layout === "object" ? plan.layout : {};
  plan.layout[nodeId] = { x, y };
  writeIvrBuildPlan(plan);
  vccIvrState.selectedNodeId = nodeId;
  vccRefreshFromBuildPlan();
}

function vccImportIvrFile(event) {
  const file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      vccShowImportedIvrXml(String(reader.result || ""), file.name);
    } catch (e) {
      showIvrBuilderError(e.message);
    }
  };
  reader.onerror = () => showIvrBuilderError("Could not read IVR export file.");
  reader.readAsText(file);
}

function vccShowImportedIvrXml(xmlText, fileName) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "text/xml");
  if (doc.querySelector("parsererror")) {
    throw new Error("Imported file is not valid XML.");
  }
  const root = doc.documentElement;
  if (!root || root.tagName !== "ivrScript") {
    throw new Error("Expected a Five9 <ivrScript> export.");
  }
  const moduleElements = [...(root.querySelector("modules")?.children || [])];
  const catalog = new Map(vccIvrState.palette.map(item => [item.module_type, item]));
  const nodes = moduleElements.map((module, index) => {
    const moduleId = module.querySelector(":scope > moduleId")?.textContent?.trim() || `${module.tagName}_${index}`;
    const moduleName = module.querySelector(":scope > moduleName")?.textContent?.trim() || module.tagName;
    const typeInfo = catalog.get(module.tagName) || {};
    return {
      id: moduleId,
      module_id: moduleId,
      module_type: module.tagName,
      label: moduleName,
      subtitle: module.tagName,
      x: Number(module.querySelector(":scope > locationX")?.textContent || (80 + (index % 5) * 170)),
      y: Number(module.querySelector(":scope > locationY")?.textContent || (80 + Math.floor(index / 5) * 110)),
      unsupported: typeInfo.generation_status !== "supported_v1",
      locked: true
    };
  });
  const moduleById = new Set(nodes.map(node => node.id));
  const edges = [];
  for (const module of moduleElements) {
    const from = module.querySelector(":scope > moduleId")?.textContent?.trim();
    if (!from) continue;
    const single = module.querySelector(":scope > singleDescendant")?.textContent?.trim();
    if (single && moduleById.has(single)) {
      edges.push({ id: `edge_${from}_${single}`, from, to: single, label: "" });
    }
    const exceptional = module.querySelector(":scope > exceptionalDescendant")?.textContent?.trim();
    if (exceptional && moduleById.has(exceptional)) {
      edges.push({ id: `edge_${from}_${exceptional}_exception`, from, to: exceptional, label: "Exception" });
    }
    for (const entry of [...module.querySelectorAll(":scope > data > branches > entry")]) {
      const label = entry.querySelector(":scope > key")?.textContent?.trim() || "";
      const target = entry.querySelector(":scope > value > desc")?.textContent?.trim() || "";
      if (target && moduleById.has(target)) {
        edges.push({ id: `edge_${from}_${target}_${label.replace(/[^a-z0-9]+/gi, "_")}`, from, to: target, label });
      }
    }
  }
  vccIvrState.hasWorkspace = true;
  vccIvrState.importedMode = true;
  vccIvrState.referenceNodes = [];
  vccIvrState.customNodes = [];
  vccIvrState.canvasEdges = [];
  vccIvrState.latestCompile = null;
  vccIvrState.selectedNodeId = nodes[0]?.id || "menu";
  vccIvrState.visual = {
    build_plan_schema: "imported_five9ivr_view",
    valid: false,
    errors: ["Imported script is view-only until rebuilt as a supported compiler plan."],
    warnings: [],
    nodes,
    edges,
    palette: vccIvrState.palette,
    required_preflight_objects: {}
  };
  writeIvrBuildPlan({
    imported_script_name: fileName,
    mode: "view_only_import",
    module_count: nodes.length,
    edge_count: edges.length
  });
  document.getElementById("ib-xml-output").value = xmlText;
  vccRenderVisual();
}

function vccBuildCanvasFromUi() {
  if (vccIvrState.importedMode) {
    return {
      schema: "five9_ivr_canvas_v1",
      view_only: true,
      script_name: "Imported Five9 IVR",
      nodes: ((vccIvrState.visual || {}).nodes || []).map(node => ({
        id: node.id,
        module_type: node.module_type,
        label: node.label,
        position: { x: Number(node.x) || 0, y: Number(node.y) || 0 },
        config: {}
      })),
      edges: ((vccIvrState.visual || {}).edges || []).map(edge => ({
        id: edge.id,
        source: edge.from || edge.source,
        target: edge.to || edge.target,
        label: edge.label || ""
      }))
    };
  }
  const plan = readIvrBuildPlan();
  const visualNodes = ((vccIvrState.visual || {}).nodes || []).map(node => vccCanvasNodeFromVisualNode(node, plan));
  const customNodes = vccIvrState.customNodes.map(node => ({
    id: node.id,
    module_type: node.module_type,
    label: node.label,
    position: { x: Number(node.x) || 0, y: Number(node.y) || 0 },
    config: node.config || {}
  }));
  const edges = [...(((vccIvrState.visual || {}).edges) || []), ...vccIvrState.canvasEdges].map(edge => ({
    id: edge.id,
    source: edge.from || edge.source,
    target: edge.to || edge.target,
    label: edge.label || ""
  }));
  return {
    schema: "five9_ivr_canvas_v1",
    script_name: plan.script_name,
    description: plan.description || "",
    nodes: [...visualNodes, ...customNodes],
    edges
  };
}

function vccCanvasNodeFromVisualNode(node, plan) {
  let config = {};
  if (node.id === "greeting") {
    config = { prompt_name: plan.greeting?.prompt_name || "Greeting", text: plan.greeting?.text || "" };
  } else if (node.id === "menu") {
    config = { name: plan.menu?.name || "Main Menu" };
  } else if (node.id.startsWith("transfer_")) {
    const digit = node.digit || node.id.replace("transfer_", "");
    const option = (plan.menu?.options || []).find(item => String(item.digit) === String(digit)) || {};
    config = { target: option.target || node.target || node.label, digit, label: option.label || node.label };
  }
  return {
    id: node.id,
    module_type: node.module_type,
    label: node.label,
    position: { x: Number(node.x) || 0, y: Number(node.y) || 0 },
    config
  };
}

async function runIvrBuilderValidate() {
  if (vccIvrState.importedMode) {
    showIvrBuilderError("Imported scripts are view-only. Start a blank compiler-backed script to validate or deploy.");
    return;
  }
  try {
    const res = await fetch("/api/run/five9/ivr-builder/validate-canvas", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ canvas: vccCanvasPayload() })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    if (vccHasUnsupportedMainFlowBlocks()) {
      data.valid = false;
      data.errors = [...(data.errors || []), "Unsupported reference module in Main Flow blocks compile."];
    }
    showIvrBuilderData("VCC Canvas Validation", data);
  } catch (e) {
    showIvrBuilderError(e.message);
  }
}

async function runIvrBuilderCompile() {
  if (vccIvrState.importedMode) {
    showIvrBuilderError("Imported scripts are view-only. Rebuild the flow as a supported compiler plan before compiling.");
    return;
  }
  if (!vccIvrState.hasWorkspace) {
    showIvrBuilderError("Start a blank script or load a sample before compiling.");
    return;
  }
  if (vccHasUnsupportedMainFlowBlocks()) {
    showIvrBuilderError("Compile blocked: remove unsupported reference modules from Main Flow before generating Five9 XML.");
    vccShowBottomTab("xml");
    return;
  }
  try {
    const data = await postIvrBuilderJson(
      "/api/run/five9/ivr-builder/compile-canvas",
      { canvas: vccBuildCanvasFromUi() },
      "Compiled Five9 IVR XML"
    );
    vccIvrState.latestCompile = data;
    if (data.xmlDefinition) {
      document.getElementById("ib-xml-output").value = data.xmlDefinition;
      vccShowBottomTab("xml");
    }
    if (data.deployable === false) {
      showIvrBuilderData("Compiled XML - Certification Required", data);
    }
  } catch (e) {
    showIvrBuilderError(e.message);
  }
}

async function runIvrBuilderDeploy() {
  if (vccIvrState.importedMode) {
    showIvrBuilderError("Imported scripts are view-only and cannot be deployed by the compiler.");
    return;
  }
  if (!vccIvrState.hasWorkspace) {
    showIvrBuilderError("Start a blank script or load a sample before deploy.");
    return;
  }
  if (vccHasUnsupportedMainFlowBlocks()) {
    showIvrBuilderError("Deploy blocked: unsupported reference modules cannot be deployed by the V1 compiler.");
    return;
  }
  let plan;
  try {
    plan = readIvrBuildPlan();
  } catch (e) {
    showIvrBuilderError(`Invalid build plan JSON: ${e.message}`);
    return;
  }
  const xml = document.getElementById("ib-xml-output").value.trim();
  if (!xml) {
    showIvrBuilderError("Compile XML before deploy.");
    vccShowBottomTab("xml");
    return;
  }
  if (vccIvrState.latestCompile && vccIvrState.latestCompile.deployable === false) {
    showIvrBuilderError("Deploy blocked: this XML contains compiler-candidate modules that need live certification first.");
    vccShowBottomTab("deploy");
    return;
  }
  const payload = {
    mode: ivrBuilderMode,
    approved: document.getElementById("ib-approved").checked,
    domain: document.getElementById("ib-domain").value,
    username: document.getElementById("ib-username").value.trim(),
    password: document.getElementById("ib-password").value,
    script_name: plan.script_name,
    description: plan.description || "",
    xml_definition: xml
  };
  const data = await postIvrBuilderJson("/api/run/five9/ivr-builder/deploy", payload, "IVR Builder Deploy");

// ---------------------------------------------------------------------------
// Load credentials from server .env
// ---------------------------------------------------------------------------
async function readApiResponse(res) {
  const text = await res.text();
  if (!text) return {};
  try {
    return JSON.parse(text);
  } catch (e) {
    return { detail: text || res.statusText };
  }
}

async function loadCredentials(endpoint, prefix = "f") {
  const btnId = prefix === "pf" ? "pf-load-creds-btn" : prefix === "pb-preflight" ? "pb-preflight-load-creds-btn" : prefix === "cw" ? "cw-load-creds-btn" : prefix === "md" ? "md-load-creds-btn" : prefix === "rb" ? "rb-load-creds-btn" : prefix === "iv" ? "iv-load-creds-btn" : prefix === "ib" ? "ib-load-creds-btn" : "load-creds-btn";
  const btn = document.getElementById(btnId);
  btn.textContent = "Loading...";
  btn.disabled = true;
  try {
    const res = await fetch(endpoint);
    const data = await readApiResponse(res);
    if (!res.ok) throw new Error(data.detail || res.statusText);
    if (data.username) document.getElementById(`${prefix}-username`).value = data.username;
    if (data.password) document.getElementById(`${prefix}-password`).value = data.password;
    if (data.domain) {
      const sel = document.getElementById(`${prefix}-domain`);
      const opt = [...sel.options].find(o => o.value === data.domain);
      if (opt) sel.value = data.domain;
    }
    btn.textContent = "Loaded";
    setTimeout(() => { btn.textContent = "Load from .env"; btn.disabled = false; }, 1500);
  } catch (e) {
    btn.textContent = "Failed";
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------------------
// Run tool
// ---------------------------------------------------------------------------
async function runTool(toolId) {
  const tool = TOOLS[toolId];
  const payload = tool.collect();
  const resultsArea = document.getElementById("results-area");
  const runBtn = document.getElementById("run-btn");
  const idleLabel = tool.buttonLabel || "Run";

  runBtn.disabled = true;
  runBtn.innerHTML = `<span class="spinner"></span> Running...`;
  resultsArea.innerHTML = "";

  const endpoint = payload._endpoint || tool.endpoint;
  delete payload._endpoint;

  try {
    const isFormData = payload instanceof FormData;
    const res = await fetch(endpoint, {
      method: "POST",
      headers: isFormData ? undefined : { "Content-Type": "application/json" },
      body: isFormData ? payload : JSON.stringify(payload),
    });

    const data = await readApiResponse(res);

    if (!res.ok) {
      resultsArea.innerHTML = `<div class="alert error">Error: ${data.detail || res.statusText}</div>`;
      return;
    }

    const renderer = tool.renderResults || renderResults;
    renderer(resultsArea, data, payload.dry_run);
  } catch (e) {
    resultsArea.innerHTML = `<div class="alert error">Network error: ${e.message}</div>`;
  } finally {
    if (toolId === "five9.playbook_agent") {
      const keyInput = document.getElementById("pb-api-key");
      if (keyInput) keyInput.value = "";
    }
    runBtn.disabled = false;
    runBtn.innerHTML = idleLabel;
  }
}

function clearResults() {
  const area = document.getElementById("results-area");
  if (area) area.innerHTML = "";
}

      <td><span class="tool-name">${escHtml(result.tool_name)}</span></td>
      <td>${escHtml(formatPreflightContext(result))}</td>
      <td><span class="action-badge ${result.result === "failed" ? "failed" : result.result === "success" ? "created" : "dry-run"}">${escHtml(result.result)}</span></td>
      <td>${escHtml(result.timestamp)}</td>
    </tr>
    <tr>
      <td colspan="4">
        ${result.error ? `<div class="alert error" style="margin-bottom:8px">${escHtml(result.error)}</div>` : ""}
        <pre class="preflight-data">${escHtml(JSON.stringify(result.data, null, 2))}</pre>
      </td>
    </tr>
  `).join("");

  container.innerHTML = `
    <div class="card results-card visible" style="margin-top:16px">
      <div class="card-title">IVR Script Results</div>
      <div class="alert ${alertClass}">${alertMsg}</div>
      <div class="summary-pills">
        <span class="pill total">${summary.total} IVR calls</span>
        ${failed ? `<span class="pill failed">${failed} failed</span>` : ""}
        <span class="pill ${summary.live ? "created" : "skipped"}">${escHtml(summary.mode)} mode</span>
        ${objectCount ? `<span class="pill total">${objectCount} script objects</span>` : ""}
      </div>
      <table>
        <thead>
          <tr>
            <th>Tool</th>
            <th>Target</th>
            <th>Result</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;

  container.scrollIntoView({ behavior: "smooth", block: "start" });
}

function formatPreflightContext(result) {
  const params = result && result.params ? result.params : {};
  if (params.skill_name) return `skill_name: ${params.skill_name}`;
  if (params.disposition_name) return `disposition_name: ${params.disposition_name}`;
  if (params.campaign_name) return `campaign_name: ${params.campaign_name}`;
  if (params.prompt_name) return `prompt_name: ${params.prompt_name}`;
  if (params.dnis) return `dnis: ${Array.isArray(params.dnis) ? params.dnis.join(", ") : params.dnis}`;
  if (params.skills) return `skills: ${Array.isArray(params.skills) ? params.skills.join(", ") : params.skills}`;
  if (params.dispositions) return `dispositions: ${Array.isArray(params.dispositions) ? params.dispositions.join(", ") : params.dispositions}`;
  if (params.name) return `name: ${params.name}`;
  if (params.name_pattern) return `name_pattern: ${params.name_pattern}`;
  if (params.xml_definition) return "xml_definition: provided";
  if (params.campaign_type) return `campaign_type: ${params.campaign_type}`;
  if (params.select_unassigned) return "select_unassigned: true";
  return "all";
}

function escHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ---------------------------------------------------------------------------
// File / folder pickers — call backend which opens native OS dialog
// ---------------------------------------------------------------------------
async function browseFile(inputId, filter, title) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const res = await fetch(`/api/pick/file?filter=${encodeURIComponent(filter)}&title=${encodeURIComponent(title)}`);
    const data = await res.json();
    if (data.path) document.getElementById(inputId).value = data.path;
  } catch (e) {
    console.error("Picker error:", e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Browse&hellip;";
  }
}

async function browseDirectory(inputId, title) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const res = await fetch(`/api/pick/directory?title=${encodeURIComponent(title)}`);
    const data = await res.json();
    if (data.path) document.getElementById(inputId).value = data.path;
  } catch (e) {
    console.error("Picker error:", e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Browse&hellip;";
  }
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
configureShell();
renderTree(
  filterToolTree(TREE, IS_TEST_PAGE ? TEST_TOOL_IDS : MAIN_TOOL_IDS),
  document.getElementById("tree"),
);
</script>
